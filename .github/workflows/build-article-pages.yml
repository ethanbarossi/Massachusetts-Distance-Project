name: Build homepage article pagination

on:
  push:
    branches:
      - main
    paths:
      - "articles/**.html"
      - "scripts/build_article_pages.py"
      - ".github/workflows/build-article-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rebuild homepage article data
        run: python scripts/build_article_pages.py

      - name: Commit generated article data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/articles-data.js

          if git diff --cached --quiet; then
            echo "No article-data changes."
          else
            git commit -m "Auto-update homepage article pagination [skip ci]"
            git push
          fi
